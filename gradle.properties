# Project-wide Gradle settings.
# Specifies the JVM arguments used for the daemon process.
org.gradle.jvmargs=-Xmx6g -XX:+UseParallelGC -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

# Run modules in parallel (safe for decoupled multi-module projects)
org.gradle.parallel=true

# Enable build cache to avoid redundant compilation across runs
org.gradle.caching=true

# Configuration cache – skips re-configuration when build scripts haven't changed
org.gradle.configuration-cache=true

# File system watching to avoid disk scans
org.gradle.vfs.watch=true

# Kotlin code style and incremental compilation optimizations
kotlin.code.style=official
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true
kotlin.daemon.jvmargs=-Xmx2g -XX:+UseParallelGC

# Android build speed optimizations
android.useAndroidX=true
android.nonTransitiveRClass=true